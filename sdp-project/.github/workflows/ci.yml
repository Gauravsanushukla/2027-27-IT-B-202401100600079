name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion-service, processing-service, api-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install || echo "no package.json yet"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test || echo "no tests yet"

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [ingestion-service, processing-service, api-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      # TODO: Add push-to-registry step (Docker Hub / GHCR / ECR) once decided
      # TODO: Add deploy step (kubectl apply / helm upgrade) once cluster is ready
