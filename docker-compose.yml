version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sdp_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ingestion-service:
    build: ./services/ingestion-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db

  processing-service:
    build: ./services/processing-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - ingestion-service

  api-service:
    build: ./services/api-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - processing-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-service

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  db_data:
